<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f5ef" />
    <meta
      name="description"
      content="Bakterien-Jump – rette Bacti vor dem Labor-Chaos."
    />
    <title>Bakterien-Jump</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 x=%2250%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2252%22>🦠</text></svg>"
    />
    <style>
      :root {
        color-scheme: light;
        --background: #f2f5ef;
        --paper: #f8faf4;
        --text: #173e48;
        --pencil: #274e57;
        --muted: #6c8384;
        --line: #9fb7b5;
        --grid: rgb(45 111 119 / 10%);
        --grid-major: rgb(45 111 119 / 17%);
        --accent: #008e7f;
        --lavender: #82749b;
        --sunny: #c9a85f;
        --danger: #c85854;
        --ink-stain: rgb(23 62 72 / 16%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background-color: var(--background);
        background-image:
          radial-gradient(rgb(23 62 72 / 5%) 0.65px, transparent 0.75px),
          linear-gradient(rgb(45 111 119 / 5%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(45 111 119 / 5%) 1px, transparent 1px);
        background-size: 6px 6px, 24px 24px, 24px 24px;
        color: var(--text);
        font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo,
          Consolas, monospace;
        font-variant-numeric: tabular-nums slashed-zero;
        overscroll-behavior: none;
      }

      main {
        width: min(960px, calc(100% - 32px));
        min-height: 100svh;
        margin: 0 auto;
        padding: 32px 0 24px;
        display: grid;
        grid-template-rows: auto minmax(360px, 1fr) auto;
        gap: 18px;
      }

      header {
        position: relative;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding: 7px 10px 10px 15px;
        border-bottom: 1px solid rgb(23 62 72 / 42%);
        border-left: 2px solid var(--accent);
      }

      .eyebrow,
      .story {
        margin: 0;
      }

      .eyebrow {
        margin-bottom: 4px;
        color: var(--accent);
        font-size: 0.61rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo,
          monospace;
        font-size: clamp(1.2rem, 4vw, 1.75rem);
        font-weight: 760;
        letter-spacing: 0.11em;
        line-height: 1.05;
        text-transform: uppercase;
      }

      .story {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.71rem;
        letter-spacing: 0.04em;
      }

      .score {
        margin: 0;
        color: var(--muted);
        border: 1px solid rgb(23 62 72 / 35%);
        background: rgb(248 250 244 / 76%);
        padding: 7px 9px;
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .score strong {
        color: var(--text);
        font-weight: 650;
      }

      .score-label {
        font-size: 0.54rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .score-separator {
        margin: 0 4px;
        color: var(--accent);
      }

      #best {
        color: var(--lavender);
        font-weight: 650;
      }

      #game {
        position: relative;
        min-height: 400px;
        overflow: hidden;
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 12px 12px, 12px 12px;
        border: 1px solid rgb(23 62 72 / 74%);
        border-radius: 2px;
        box-shadow:
          3px 3px 0 rgb(23 62 72 / 9%),
          8px 10px 24px rgb(23 62 72 / 5%);
        touch-action: manipulation;
        user-select: none;
      }

      #player,
      .obstacle {
        position: absolute;
        z-index: 2;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      #player {
        left: clamp(28px, 9vw, 80px);
        bottom: 44px;
        width: 76px;
        height: 76px;
        transform-origin: bottom center;
      }

      #player img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        mix-blend-mode: normal;
        transform: scale(1.04);
      }

      #player.moving img {
        animation: sketch-run 240ms steps(2, end) infinite;
      }

      .obstacle {
        left: 0;
        color: var(--pencil);
        opacity: 0.88;
        transform-origin: bottom center;
      }

      .obstacle svg {
        display: block;
        width: 100%;
        height: 100%;
        filter: url('#rough-ink');
        stroke-width: 1.22;
      }

      .ink-stain {
        position: absolute;
        z-index: 1;
        top: 58px;
        right: 7%;
        width: 128px;
        height: 78px;
        pointer-events: none;
        opacity: 0.8;
        background:
          radial-gradient(circle at 14% 72%, var(--ink-stain) 0 2px, transparent 3px),
          radial-gradient(circle at 86% 18%, var(--ink-stain) 0 1.5px, transparent 2.5px),
          radial-gradient(circle at 72% 83%, var(--ink-stain) 0 2.5px, transparent 3.5px),
          radial-gradient(
            ellipse at 52% 48%,
            transparent 0 31%,
            var(--ink-stain) 32% 35%,
            transparent 37% 42%,
            var(--ink-stain) 44% 45%,
            transparent 47%
          );
        filter: blur(0.25px);
        transform: rotate(-11deg);
        mix-blend-mode: multiply;
      }

      .ground {
        position: absolute;
        right: 0;
        bottom: 42px;
        left: 0;
        height: 4px;
        background:
          linear-gradient(rgb(23 62 72 / 72%) 0 1px, transparent 1px),
          repeating-linear-gradient(
            90deg,
            rgb(23 62 72 / 42%) 0 1px,
            transparent 1px 48px
          );
        transform: rotate(-0.025deg);
      }

      .lab-status {
        position: absolute;
        top: 14px;
        left: 14px;
        color: var(--accent);
        border: 1px solid rgb(0 142 127 / 36%);
        background: rgb(248 250 244 / 72%);
        padding: 4px 6px;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .coordinate-label {
        position: absolute;
        right: 11px;
        bottom: 50px;
        z-index: 1;
        color: rgb(23 62 72 / 50%);
        font-size: 0.52rem;
        letter-spacing: 0.1em;
        pointer-events: none;
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        background: rgb(242 245 239 / 86%);
        text-align: center;
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay-content {
        position: relative;
        padding: 24px 30px;
        border: 1px solid rgb(23 62 72 / 42%);
        background: rgb(248 250 244 / 84%);
        box-shadow: 3px 3px 0 rgb(23 62 72 / 8%);
      }

      .overlay h2 {
        margin: 0;
        font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo,
          monospace;
        font-size: clamp(1.15rem, 4vw, 1.65rem);
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .overlay[data-state='danger'] h2 {
        color: var(--danger);
      }

      .overlay p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      button {
        margin-top: 20px;
        border: 1px solid rgb(23 62 72 / 72%);
        border-radius: 1px;
        background: var(--paper);
        color: var(--text);
        padding: 8px 15px;
        font: inherit;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 2px 2px 0 rgb(0 142 127 / 20%);
      }

      button:hover {
        background: rgb(0 142 127 / 10%);
        color: var(--text);
      }

      button:focus-visible {
        outline: 3px solid var(--sunny);
        outline-offset: 3px;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .control {
        min-width: 116px;
        margin: 0;
        padding: 6px 12px;
        border-color: var(--line);
        box-shadow: none;
        color: var(--muted);
        font-size: 0.64rem;
      }

      .control strong {
        margin-right: 5px;
        color: var(--text);
        font-size: 1rem;
      }

      .control.is-active {
        border-color: var(--accent);
        background: rgb(0 142 127 / 11%);
        color: var(--text);
        transform: translate(1px, 1px) rotate(-1deg);
      }

      @keyframes sketch-run {
        0%,
        100% {
          transform: scale(1.04) translateY(0) rotate(-0.7deg);
        }
        50% {
          transform: scale(1.04) translateY(-0.8px) rotate(0.7deg);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 20px, 960px);
          padding-top: 20px;
          gap: 12px;
        }

        header {
          align-items: center;
          padding-left: 10px;
        }

        .story {
          max-width: 210px;
        }

        .score {
          padding: 5px 6px;
          font-size: 0.6rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }

        #player.moving img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      style="position: absolute"
    >
      <filter id="rough-ink" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.025"
          numOctaves="1"
          seed="7"
          result="paper-noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="paper-noise"
          scale="0.7"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <main>
      <header>
        <div>
          <p class="eyebrow">Bio-System // Petrischale 07</p>
          <h1>Bakterien-Jump</h1>
          <p class="story">Rette Bacti vor dem Labor-Chaos.</p>
        </div>
        <p class="score" aria-label="Spielstand">
          <span class="score-label">DIST</span>
          <strong id="score">0000</strong>
          <span class="score-separator">//</span>
          <span class="score-label">BEST</span>
          <span id="best">0000</span>
        </p>
      </header>

      <section
        id="game"
        role="application"
        aria-label="Bakterien-Jump. Mit Leertaste oder Pfeil nach oben doppelt springen. Mit Pfeil nach unten bücken."
      >
        <div class="lab-status" aria-hidden="true">
          SYS / STABIL · 37 °C · pH 7,2
        </div>
        <div class="ink-stain" aria-hidden="true"></div>
        <div class="coordinate-label" aria-hidden="true">
          X 000—960 / Y 000—400
        </div>
        <div id="player" aria-label="Bacti">
          <img src="bacti-kawaii-iconic.png" alt="" />
        </div>
        <div class="ground" aria-hidden="true"></div>

        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 id="message">Bacti // Bereit</h2>
            <p id="submessage">
              Springe doppelt. Bücke dich unter schwebenden Pipetten.
            </p>
            <button id="start" type="button">Run starten</button>
          </div>
        </div>

        <span id="status" class="sr-only" aria-live="polite"></span>
      </section>

      <div class="controls" aria-label="Spielsteuerung">
        <button class="control" id="jump-control" type="button">
          <strong>↑</strong> Sprung ×2
        </button>
        <button class="control" id="crouch-control" type="button">
          <strong>↓</strong> Bücken
        </button>
      </div>
    </main>

    <script>
      (() => {
        const game = document.querySelector('#game');
        const player = document.querySelector('#player');
        const overlay = document.querySelector('#overlay');
        const message = document.querySelector('#message');
        const submessage = document.querySelector('#submessage');
        const startButton = document.querySelector('#start');
        const scoreElement = document.querySelector('#score');
        const bestElement = document.querySelector('#best');
        const statusElement = document.querySelector('#status');
        const jumpControl = document.querySelector('#jump-control');
        const crouchControl = document.querySelector('#crouch-control');

        const gravity = 2050;
        const jumpVelocity = 760;
        const groundOffset = 44;
        const supplies = [
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>',
            width: 46,
            height: 48,
            lift: 0,
            rotation: -2,
            label: 'Becherglas',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg>',
            width: 60,
            height: 82,
            lift: 0,
            rotation: 1,
            label: 'Kolben',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>',
            width: 80,
            height: 30,
            lift: 47,
            rotation: -4,
            label: 'Schwebende Pipette',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v17.5A2.5 2.5 0 0 1 6.5 22A2.5 2.5 0 0 1 4 19.5V2"/><path d="M20 2v17.5a2.5 2.5 0 0 1-2.5 2.5a2.5 2.5 0 0 1-2.5-2.5V2"/><path d="M3 2h7"/><path d="M14 2h7"/><path d="M9 16H4"/><path d="M20 16h-5"/></svg>',
            width: 56,
            height: 88,
            lift: 0,
            rotation: 2,
            label: 'Reagenzgläser',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7 6.82 21.18a2.83 2.83 0 0 1-3.99-.01 2.83 2.83 0 0 1 0-4L17 3"/><path d="m16 2 6 6"/><path d="M12 16H4"/></svg>',
            width: 44,
            height: 60,
            lift: 0,
            rotation: -3,
            label: 'Reagenzglas',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>',
            width: 68,
            height: 27,
            lift: 0,
            rotation: -6,
            label: 'Liegende Pipette',
          },
        ];

        let state = 'idle';
        let playerY = 0;
        let velocity = 0;
        let jumpCount = 0;
        let crouching = false;
        let score = 0;
        let best = Number.parseInt(
          localStorage.getItem('bakterien-jump-best') || '0',
          10,
        );
        let obstacles = [];
        let nextObstacle = 0.9;
        let previousTime = 0;
        let frame = 0;

        bestElement.textContent = formatScore(best);

        function formatScore(value) {
          return String(Math.floor(value)).padStart(4, '0');
        }

        function clearObstacles() {
          obstacles.forEach((obstacle) => obstacle.element.remove());
          obstacles = [];
        }

        function startGame() {
          clearObstacles();
          state = 'running';
          playerY = 0;
          velocity = jumpVelocity;
          jumpCount = 1;
          crouching = false;
          score = 0;
          nextObstacle = 0.9;
          previousTime = performance.now();
          overlay.hidden = true;
          overlay.dataset.state = '';
          scoreElement.textContent = '0000';
          player.classList.add('moving');
          crouchControl.classList.remove('is-active');
          statusElement.textContent = 'Spiel gestartet.';
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(update);
        }

        function jump() {
          if (state !== 'running') {
            startGame();
            return;
          }

          if (jumpCount < 2) {
            velocity = jumpCount === 0 ? jumpVelocity : jumpVelocity * 0.9;
            jumpCount += 1;
            jumpControl.classList.add('is-active');
            window.setTimeout(() => jumpControl.classList.remove('is-active'), 110);
          }
        }

        function setCrouching(next) {
          if (state !== 'running') return;
          crouching = next;
          crouchControl.classList.toggle('is-active', crouching);
        }

        function addObstacle() {
          const supply = supplies[Math.floor(Math.random() * supplies.length)];
          const element = document.createElement('div');
          element.className = 'obstacle';
          element.innerHTML = supply.drawing;
          element.setAttribute('aria-label', supply.label);
          element.style.width = `${supply.width}px`;
          element.style.height = `${supply.height}px`;
          element.style.bottom = `${groundOffset + supply.lift}px`;
          game.appendChild(element);

          obstacles.push({
            ...supply,
            x: game.clientWidth + 20,
            element,
          });
        }

        function endGame() {
          state = 'over';
          velocity = 0;
          crouching = false;
          player.classList.remove('moving');
          crouchControl.classList.remove('is-active');
          const finalScore = Math.floor(score);

          if (finalScore > best) {
            best = finalScore;
            bestElement.textContent = formatScore(best);
            localStorage.setItem('bakterien-jump-best', String(best));
          }

          message.textContent = 'Kontaminiert!';
          submessage.textContent = `${finalScore} Punkte`;
          startButton.textContent = 'Neustart';
          overlay.dataset.state = 'danger';
          overlay.hidden = false;
          statusElement.textContent = `Spiel vorbei. ${finalScore} Punkte.`;
        }

        function update(now) {
          const delta = Math.min((now - previousTime) / 1000, 0.034);
          previousTime = now;

          velocity -= gravity * delta;
          playerY = Math.max(0, playerY + velocity * delta);
          if (playerY === 0) {
            velocity = 0;
            jumpCount = 0;
          }
          const crouchScale = crouching ? 0.56 : 1;
          player.style.transform = `translateY(${-playerY}px) rotate(${Math.max(-8, Math.min(8, -velocity / 85))}deg) scaleY(${crouchScale})`;

          score += delta * 10;
          scoreElement.textContent = formatScore(score);

          const speed = 330 + Math.min(score * 1.3, 250);
          nextObstacle -= delta;

          if (nextObstacle <= 0) {
            addObstacle();
            nextObstacle = Math.max(0.85, 1.45 + Math.random() * 0.65 - score / 220);
          }

          const playerLeft = player.offsetLeft + 10;
          const playerRight = playerLeft + player.offsetWidth - 20;
          const playerBottom = playerY;
          const playerTop = playerBottom + (crouching ? 31 : 54);
          let collision = false;

          obstacles.forEach((obstacle) => {
            obstacle.x -= speed * delta;
            obstacle.element.style.transform = `translateX(${obstacle.x}px) rotate(${obstacle.rotation}deg)`;

            const obstacleBottom = obstacle.lift;
            const obstacleTop = obstacleBottom + obstacle.height;

            if (
              playerRight - 8 > obstacle.x &&
              playerLeft + 9 < obstacle.x + obstacle.width &&
              playerTop > obstacleBottom + 6 &&
              playerBottom < obstacleTop - 6
            ) {
              collision = true;
            }
          });

          obstacles = obstacles.filter((obstacle) => {
            if (obstacle.x + obstacle.width > -10) return true;
            obstacle.element.remove();
            return false;
          });

          if (collision) {
            endGame();
            return;
          }

          if (state === 'running') frame = requestAnimationFrame(update);
        }

        startButton.addEventListener('click', startGame);
        jumpControl.addEventListener('click', jump);
        crouchControl.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          setCrouching(true);
        });
        crouchControl.addEventListener('pointerup', () => setCrouching(false));
        crouchControl.addEventListener('pointercancel', () => setCrouching(false));
        game.addEventListener('pointerdown', (event) => {
          if (!event.target.closest('button')) jump();
        });
        window.addEventListener('keydown', (event) => {
          if (event.code === 'Space' || event.code === 'ArrowUp') {
            event.preventDefault();
            jump();
          }
          if (event.code === 'ArrowDown') {
            event.preventDefault();
            setCrouching(true);
          }
        });
        window.addEventListener('keyup', (event) => {
          if (event.code === 'ArrowDown') setCrouching(false);
        });
        window.addEventListener('pointerup', () => setCrouching(false));

      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efeee9" />
    <meta
      name="description"
      content="Jumpy"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JUMPY" />
    <meta property="og:description" content="Jumpy" />
    <meta
      property="og:image"
      content="https://katharina-brenner.github.io/bakterien-jumpy/og-minimal.png"
    />
    <meta property="og:image:alt" content="JUMPY" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JUMPY" />
    <meta name="twitter:description" content="Jumpy" />
    <meta
      name="twitter:image"
      content="https://katharina-brenner.github.io/bakterien-jumpy/og-minimal.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>JUMPY</title>
    <link rel="icon" href="jumpy-sprite-minimal.png" />
    <style>
      :root {
        color-scheme: light;
        --background: #e9e8e3;
        --paper: #f7f5ef;
        --text: #484744;
        --pencil: #5e5c58;
        --muted: #85817b;
        --frame: rgb(72 70 67 / 28%);
        --frame-width: 1px;
        --type-weight: 500;
        --drawing-weight: 0.9;
        --grid: rgb(75 73 69 / 8%);
        --grid-major: rgb(75 73 69 / 13%);
        --accent: #6f6c67;
        --danger: #696663;
        --pastel-pink: #d7aaa9;
        --pastel-lilac: #b9accb;
        --pastel-mint: #aec9b7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background-color: var(--background);
        background-image:
          radial-gradient(rgb(72 70 67 / 4%) 0.65px, transparent 0.75px),
          linear-gradient(rgb(72 70 67 / 4%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(72 70 67 / 4%) 1px, transparent 1px);
        background-size: 6px 6px, 24px 24px, 24px 24px;
        color: var(--text);
        font-family: "Oxanium", "SFMono-Regular", Menlo, Consolas, sans-serif;
        font-weight: var(--type-weight);
        font-variant-numeric: tabular-nums slashed-zero;
        overscroll-behavior: none;
      }

      main {
        width: min(960px, calc(100% - 32px));
        min-height: 100svh;
        margin: 0 auto;
        padding: 32px 0 24px;
        display: grid;
        grid-template-rows: auto minmax(360px, 1fr) auto;
        gap: 18px;
      }

      header {
        position: relative;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 16px;
        border: var(--frame-width) solid var(--frame);
        border-radius: 24px;
        background: rgb(247 245 239 / 72%);
      }

      .story {
        margin: 0;
      }

      h1 {
        margin: 0;
        font-family: inherit;
        font-size: clamp(1.2rem, 4vw, 1.75rem);
        font-weight: var(--type-weight);
        letter-spacing: 0.05em;
        line-height: 1.05;
        background: linear-gradient(
          105deg,
          var(--pastel-pink),
          var(--pastel-lilac) 48%,
          var(--pastel-mint)
        );
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        filter: saturate(0.8);
      }

      .story {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.71rem;
        letter-spacing: 0.04em;
      }

      .score {
        margin: 0;
        color: var(--muted);
        border: var(--frame-width) solid var(--frame);
        border-radius: 999px;
        background: rgb(247 245 239 / 84%);
        padding: 7px 9px;
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .score strong {
        color: var(--text);
        font-weight: var(--type-weight);
      }

      .score-label {
        font-size: 0.54rem;
        font-weight: var(--type-weight);
        letter-spacing: 0.14em;
      }

      .score-separator {
        margin: 0 4px;
        color: var(--muted);
      }

      #best {
        color: var(--text);
        font-weight: var(--type-weight);
      }

      #game {
        position: relative;
        min-height: 400px;
        overflow: hidden;
        background-color: var(--paper);
        background-image:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 12px 12px, 12px 12px;
        border: var(--frame-width) solid var(--frame);
        border-radius: 28px;
        box-shadow:
          3px 3px 0 rgb(72 70 67 / 7%),
          8px 10px 24px rgb(72 70 67 / 5%);
        touch-action: manipulation;
        user-select: none;
      }

      #player,
      .obstacle {
        position: absolute;
        z-index: 2;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      #player {
        left: clamp(28px, 9vw, 80px);
        bottom: 44px;
        width: 76px;
        height: 76px;
        transform-origin: bottom center;
      }

      #player img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        mix-blend-mode: normal;
        opacity: 1;
        filter: contrast(1.08) saturate(0.92);
        transform: scale(1.26);
      }

      #player.moving img {
        animation: sketch-run 240ms steps(2, end) infinite;
      }

      .obstacle {
        left: 0;
        color: var(--pencil);
        opacity: 0.8;
        transform-origin: bottom center;
      }

      .obstacle svg {
        display: block;
        width: 100%;
        height: 100%;
        filter: url('#rough-ink');
        stroke-width: var(--drawing-weight);
      }

      .ground {
        position: absolute;
        right: 0;
        bottom: 42px;
        left: 0;
        height: 4px;
        background:
          linear-gradient(rgb(72 70 67 / 62%) 0 1px, transparent 1px),
          repeating-linear-gradient(
            90deg,
            rgb(72 70 67 / 34%) 0 1px,
            transparent 1px 48px
          );
        transform: rotate(-0.025deg);
      }

      .lab-status {
        position: absolute;
        top: 14px;
        left: 14px;
        color: var(--muted);
        border: var(--frame-width) solid var(--frame);
        border-radius: 999px;
        background: rgb(247 245 239 / 78%);
        padding: 5px 8px;
        font-size: 0.58rem;
        font-weight: var(--type-weight);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .coordinate-label {
        position: absolute;
        right: 11px;
        bottom: 50px;
        z-index: 1;
        color: rgb(72 70 67 / 44%);
        font-size: 0.52rem;
        letter-spacing: 0.1em;
        pointer-events: none;
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: grid;
        place-items: center;
        background: rgb(233 232 227 / 88%);
        text-align: center;
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay-content {
        position: relative;
        padding: 24px 30px;
        border: var(--frame-width) solid var(--frame);
        border-radius: 24px;
        background: rgb(247 245 239 / 90%);
        box-shadow: 3px 3px 0 rgb(72 70 67 / 6%);
      }

      .overlay h2 {
        margin: 0;
        font-family: inherit;
        font-size: clamp(1.15rem, 4vw, 1.65rem);
        font-weight: var(--type-weight);
        letter-spacing: 0.04em;
        background: linear-gradient(
          105deg,
          var(--pastel-pink),
          var(--pastel-lilac) 48%,
          var(--pastel-mint)
        );
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      .overlay[data-state='danger'] h2 {
        color: var(--danger);
        background: none;
        -webkit-text-fill-color: currentColor;
      }

      .overlay p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      button {
        margin-top: 20px;
        border: var(--frame-width) solid var(--frame);
        border-radius: 999px;
        background: var(--paper);
        color: var(--text);
        padding: 8px 15px;
        font: inherit;
        font-size: 0.7rem;
        font-weight: var(--type-weight);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 2px 2px 0 rgb(72 70 67 / 12%);
      }

      button:hover {
        background: rgb(72 70 67 / 8%);
        color: var(--text);
      }

      button:focus-visible {
        outline: 3px solid rgb(72 70 67 / 24%);
        outline-offset: 3px;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .control {
        min-width: 116px;
        margin: 0;
        padding: 6px 12px;
        border-color: var(--frame);
        box-shadow: none;
        color: var(--muted);
        font-size: 0.64rem;
      }

      .control strong {
        margin-right: 5px;
        color: var(--text);
        font-size: 1rem;
        font-weight: var(--type-weight);
      }

      .control.is-active {
        border-color: var(--text);
        background: rgb(72 70 67 / 9%);
        color: var(--text);
        transform: translate(1px, 1px) rotate(-1deg);
      }

      .wash-effect {
        position: absolute;
        inset: 0;
        z-index: 5;
        overflow: hidden;
        border-radius: inherit;
        opacity: 0;
        pointer-events: none;
      }

      .wash-effect::before {
        content: '';
        position: absolute;
        top: -54%;
        left: -12%;
        width: 124%;
        height: 62%;
        border-radius: 0 0 48% 52%;
        background:
          radial-gradient(circle at 18% 88%, rgb(255 255 252 / 74%) 0 3%, transparent 4%),
          radial-gradient(circle at 72% 82%, rgb(255 255 252 / 64%) 0 4%, transparent 5%),
          linear-gradient(
            180deg,
            rgb(247 247 243 / 28%),
            rgb(206 211 211 / 76%) 62%,
            rgb(184 190 191 / 72%)
          );
        box-shadow:
          0 18px 24px rgb(107 112 113 / 18%),
          0 34px 48px rgb(107 112 113 / 12%);
        filter: blur(0.8px);
        transform: translateY(-18%);
      }

      .wash-effect::after {
        content: '';
        position: absolute;
        inset: -10%;
        background: repeating-linear-gradient(
          99deg,
          transparent 0 34px,
          rgb(176 181 182 / 16%) 36px 39px,
          transparent 42px 76px
        );
        opacity: 0;
        transform: translateY(-28%);
      }

      .wash-effect.is-active {
        opacity: 1;
        animation: water-fade 1.55s ease-out forwards;
      }

      .wash-effect.is-active::before {
        animation: water-sweep 1.35s cubic-bezier(0.44, 0.02, 0.43, 1) forwards;
      }

      .wash-effect.is-active::after {
        animation: water-trails 1.4s ease-out forwards;
      }

      #game.is-washing > :not(.wash-effect):not(.overlay):not(.sr-only) {
        animation: ink-wash 1.25s 120ms ease-in forwards;
      }

      #game.is-washed > :not(.wash-effect):not(.overlay):not(.sr-only) {
        opacity: 0.13;
        filter: blur(4px) contrast(0.62);
      }

      @keyframes sketch-run {
        0%,
        100% {
          transform: scale(1.26) translateY(0) rotate(-0.7deg);
        }
        50% {
          transform: scale(1.26) translateY(-0.8px) rotate(0.7deg);
        }
      }

      @keyframes water-sweep {
        0% {
          transform: translateY(-18%) scaleX(1.02);
        }
        52% {
          transform: translateY(118%) scaleX(0.98);
        }
        100% {
          transform: translateY(260%) scaleX(1.03);
        }
      }

      @keyframes water-trails {
        0%,
        12% {
          opacity: 0;
          transform: translateY(-28%);
        }
        34% {
          opacity: 0.72;
        }
        100% {
          opacity: 0;
          transform: translateY(38%);
        }
      }

      @keyframes water-fade {
        0%,
        72% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes ink-wash {
        0% {
          opacity: 1;
          filter: blur(0) contrast(1);
        }
        35% {
          opacity: 0.82;
          filter: blur(0.7px) contrast(0.9);
        }
        72% {
          opacity: 0.34;
          filter: blur(2.6px) contrast(0.72);
        }
        100% {
          opacity: 0.13;
          filter: blur(4px) contrast(0.62);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 20px, 960px);
          padding-top: 20px;
          gap: 12px;
        }

        header {
          align-items: center;
          padding-left: 10px;
        }

        .story {
          max-width: 210px;
        }

        .score {
          padding: 5px 6px;
          font-size: 0.6rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }

        #player.moving img {
          animation: none;
        }

        .wash-effect.is-active,
        .wash-effect.is-active::before,
        .wash-effect.is-active::after,
        #game.is-washing > :not(.wash-effect):not(.overlay):not(.sr-only) {
          animation-duration: 180ms;
        }
      }
    </style>
  </head>
  <body>
    <svg
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      style="position: absolute"
    >
      <filter id="rough-ink" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.025"
          numOctaves="1"
          seed="7"
          result="paper-noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="paper-noise"
          scale="0.7"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <main>
      <header>
        <div>
          <h1>JUMPY</h1>
          <p class="story">Rette Jumpy vor dem Labor-Chaos.</p>
        </div>
        <p class="score" aria-label="Spielstand">
          <span class="score-label">DIST</span>
          <strong id="score">0000</strong>
          <span class="score-separator">//</span>
          <span class="score-label">BEST</span>
          <span id="best">0000</span>
        </p>
      </header>

      <section
        id="game"
        role="application"
        aria-label="Jumpy. Mit Leertaste oder Pfeil nach oben doppelt springen. Mit Pfeil nach unten bücken."
      >
        <div class="lab-status" aria-hidden="true">
          SYS / STABIL · 37 °C · pH 7,2
        </div>
        <div class="coordinate-label" aria-hidden="true">
          X 000—960 / Y 000—400
        </div>
        <div id="player" aria-label="Jumpy">
          <img src="jumpy-sprite-minimal.png" alt="" />
        </div>
        <div class="ground" aria-hidden="true"></div>
        <div class="wash-effect" id="wash-effect" aria-hidden="true"></div>

        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 id="message">JUMPY</h2>
            <p id="submessage">
              Springe doppelt. Bücke dich unter schwebenden Pipetten.
            </p>
            <button id="start" type="button">Start</button>
          </div>
        </div>

        <span id="status" class="sr-only" aria-live="polite"></span>
      </section>

      <div class="controls" aria-label="Spielsteuerung">
        <button class="control" id="jump-control" type="button">
          <strong>↑</strong> Sprung ×2
        </button>
        <button class="control" id="crouch-control" type="button">
          <strong>↓</strong> Bücken
        </button>
      </div>
    </main>

    <script>
      (() => {
        const game = document.querySelector('#game');
        const player = document.querySelector('#player');
        const overlay = document.querySelector('#overlay');
        const washEffect = document.querySelector('#wash-effect');
        const message = document.querySelector('#message');
        const submessage = document.querySelector('#submessage');
        const startButton = document.querySelector('#start');
        const scoreElement = document.querySelector('#score');
        const bestElement = document.querySelector('#best');
        const statusElement = document.querySelector('#status');
        const jumpControl = document.querySelector('#jump-control');
        const crouchControl = document.querySelector('#crouch-control');

        const gravity = 2050;
        const jumpVelocity = 760;
        const groundOffset = 44;
        const supplies = [
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>',
            width: 46,
            height: 48,
            lift: 0,
            rotation: -2,
            label: 'Becherglas',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></svg>',
            width: 60,
            height: 82,
            lift: 0,
            rotation: 1,
            label: 'Kolben',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>',
            width: 80,
            height: 30,
            lift: 47,
            rotation: -4,
            label: 'Schwebende Pipette',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v17.5A2.5 2.5 0 0 1 6.5 22A2.5 2.5 0 0 1 4 19.5V2"/><path d="M20 2v17.5a2.5 2.5 0 0 1-2.5 2.5a2.5 2.5 0 0 1-2.5-2.5V2"/><path d="M3 2h7"/><path d="M14 2h7"/><path d="M9 16H4"/><path d="M20 16h-5"/></svg>',
            width: 56,
            height: 88,
            lift: 0,
            rotation: 2,
            label: 'Reagenzgläser',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7 6.82 21.18a2.83 2.83 0 0 1-3.99-.01 2.83 2.83 0 0 1 0-4L17 3"/><path d="m16 2 6 6"/><path d="M12 16H4"/></svg>',
            width: 44,
            height: 60,
            lift: 0,
            rotation: -3,
            label: 'Reagenzglas',
          },
          {
            drawing:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/><path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/><path d="m2 22 .414-.414"/></svg>',
            width: 68,
            height: 27,
            lift: 0,
            rotation: -6,
            label: 'Liegende Pipette',
          },
          {
            drawing:
              '<svg viewBox="0 0 44 72" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9V3h10v6"/><path d="M14 9h16v7H14z"/><path d="M10 16h24"/><path d="M12 16v41a8 8 0 0 0 8 8h4a8 8 0 0 0 8-8V16"/><path d="M9 65h26"/><path d="M12 27H7v-7H3"/><circle cx="4.5" cy="20" r="2.5"/><path d="M32 38h6v8h3"/><circle cx="40.5" cy="46" r="2.5"/><path d="M16 33l4 2"/><path d="m28 33-4 2"/><circle cx="20" cy="38" r="1" fill="currentColor" stroke="none"/><circle cx="24" cy="38" r="1" fill="currentColor" stroke="none"/><path d="M18 46q4-4 8 0"/><path d="M13 51h18"/><path d="M15 56c2-2 4 2 6 0s4 2 6 0 3 0 4 1"/><path d="M18 65v4"/><path d="M26 65v4"/><path d="M15 69h6"/><path d="M23 69h6"/></svg>',
            width: 92,
            height: 152,
            lift: 0,
            rotation: 0,
            label: 'Böser Bioreaktor',
          },
        ];

        let state = 'idle';
        let playerY = 0;
        let velocity = 0;
        let jumpCount = 0;
        let crouching = false;
        let score = 0;
        let best = Number.parseInt(
          localStorage.getItem('bakterien-jump-best') || '0',
          10,
        );
        let obstacles = [];
        let nextObstacle = 0.9;
        let previousTime = 0;
        let frame = 0;
        let washTimer = 0;

        bestElement.textContent = formatScore(best);

        function formatScore(value) {
          return String(Math.floor(value)).padStart(4, '0');
        }

        function clearObstacles() {
          obstacles.forEach((obstacle) => obstacle.element.remove());
          obstacles = [];
        }

        function startGame() {
          window.clearTimeout(washTimer);
          clearObstacles();
          state = 'running';
          playerY = 0;
          velocity = jumpVelocity;
          jumpCount = 1;
          crouching = false;
          score = 0;
          nextObstacle = 0.9;
          previousTime = performance.now();
          overlay.hidden = true;
          overlay.dataset.state = '';
          game.classList.remove('is-washing', 'is-washed');
          washEffect.classList.remove('is-active');
          scoreElement.textContent = '0000';
          player.classList.add('moving');
          crouchControl.classList.remove('is-active');
          statusElement.textContent = 'Spiel gestartet.';
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(update);
        }

        function jump() {
          if (state === 'idle') {
            startGame();
            return;
          }

          if (state !== 'running') return;

          if (jumpCount < 2) {
            velocity = jumpCount === 0 ? jumpVelocity : jumpVelocity * 0.9;
            jumpCount += 1;
            jumpControl.classList.add('is-active');
            window.setTimeout(() => jumpControl.classList.remove('is-active'), 110);
          }
        }

        function setCrouching(next) {
          if (state !== 'running') return;
          crouching = next;
          crouchControl.classList.toggle('is-active', crouching);
        }

        function addObstacle() {
          const supply = supplies[Math.floor(Math.random() * supplies.length)];
          const element = document.createElement('div');
          element.className = 'obstacle';
          element.innerHTML = supply.drawing;
          element.setAttribute('aria-label', supply.label);
          element.style.width = `${supply.width}px`;
          element.style.height = `${supply.height}px`;
          element.style.bottom = `${groundOffset + supply.lift}px`;
          game.appendChild(element);

          obstacles.push({
            ...supply,
            x: game.clientWidth + 20,
            element,
          });
        }

        function endGame() {
          if (state !== 'running') return;
          state = 'washing';
          velocity = 0;
          crouching = false;
          player.classList.remove('moving');
          crouchControl.classList.remove('is-active');
          const finalScore = Math.floor(score);

          if (finalScore > best) {
            best = finalScore;
            bestElement.textContent = formatScore(best);
            localStorage.setItem('bakterien-jump-best', String(best));
          }

          message.textContent = 'Oh nein... Kontaminiert!';
          submessage.textContent = `${finalScore} Punkte`;
          startButton.textContent = 'Neustart';
          overlay.dataset.state = 'danger';
          overlay.hidden = true;
          game.classList.remove('is-washed');
          game.classList.add('is-washing');
          washEffect.classList.remove('is-active');
          void washEffect.offsetWidth;
          washEffect.classList.add('is-active');
          statusElement.textContent =
            'Oh nein... Kontaminiert! Wasser verwischt die Zeichnung.';

          const washDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches
            ? 220
            : 1450;

          washTimer = window.setTimeout(() => {
            state = 'over';
            game.classList.remove('is-washing');
            game.classList.add('is-washed');
            washEffect.classList.remove('is-active');
            overlay.hidden = false;
            statusElement.textContent = `Spiel vorbei. ${finalScore} Punkte. Neustart erforderlich.`;
          }, washDuration);
        }

        function update(now) {
          const delta = Math.min((now - previousTime) / 1000, 0.034);
          previousTime = now;

          velocity -= gravity * delta;
          playerY = Math.max(0, playerY + velocity * delta);
          if (playerY === 0) {
            velocity = 0;
            jumpCount = 0;
          }
          const crouchScale = crouching ? 0.56 : 1;
          player.style.transform = `translateY(${-playerY}px) rotate(${Math.max(-8, Math.min(8, -velocity / 85))}deg) scaleY(${crouchScale})`;

          score += delta * 10;
          scoreElement.textContent = formatScore(score);

          const speed = 330 + Math.min(score * 1.3, 250);
          nextObstacle -= delta;

          if (nextObstacle <= 0) {
            addObstacle();
            nextObstacle = Math.max(0.85, 1.45 + Math.random() * 0.65 - score / 220);
          }

          const playerLeft = player.offsetLeft + 10;
          const playerRight = playerLeft + player.offsetWidth - 20;
          const playerBottom = playerY;
          const playerTop = playerBottom + (crouching ? 31 : 54);
          let collision = false;

          obstacles.forEach((obstacle) => {
            obstacle.x -= speed * delta;
            obstacle.element.style.transform = `translateX(${obstacle.x}px) rotate(${obstacle.rotation}deg)`;

            const obstacleBottom = obstacle.lift;
            const obstacleTop = obstacleBottom + obstacle.height;

            if (
              playerRight - 8 > obstacle.x &&
              playerLeft + 9 < obstacle.x + obstacle.width &&
              playerTop > obstacleBottom + 6 &&
              playerBottom < obstacleTop - 6
            ) {
              collision = true;
            }
          });

          obstacles = obstacles.filter((obstacle) => {
            if (obstacle.x + obstacle.width > -10) return true;
            obstacle.element.remove();
            return false;
          });

          if (collision) {
            endGame();
            return;
          }

          if (state === 'running') frame = requestAnimationFrame(update);
        }

        startButton.addEventListener('click', startGame);
        jumpControl.addEventListener('click', jump);
        crouchControl.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          setCrouching(true);
        });
        crouchControl.addEventListener('pointerup', () => setCrouching(false));
        crouchControl.addEventListener('pointercancel', () => setCrouching(false));
        game.addEventListener('pointerdown', (event) => {
          if (!event.target.closest('button')) jump();
        });
        window.addEventListener('keydown', (event) => {
          if (event.code === 'Space' || event.code === 'ArrowUp') {
            event.preventDefault();
            jump();
          }
          if (event.code === 'ArrowDown') {
            event.preventDefault();
            setCrouching(true);
          }
        });
        window.addEventListener('keyup', (event) => {
          if (event.code === 'ArrowDown') setCrouching(false);
        });
        window.addEventListener('pointerup', () => setCrouching(false));

      })();
    </script>
  </body>
</html>
